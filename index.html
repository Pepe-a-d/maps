<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Mapa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23000' stroke='%23fff' stroke-width='2'/><path d='M4 16h24M16 2c5 4 5 24 0 28M16 2c-5 4-5 24 0 28' stroke='%23fff' stroke-width='1.5' fill='none'/></svg>" />
  </head>
  <body>
    <div id="map"></div>

    <div class="search" role="search">
      <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="7" />
        <path d="m20 20-3.5-3.5" />
      </svg>
      <input
        id="search-input"
        type="search"
        placeholder="Buscar un lugar…"
        autocomplete="off"
        spellcheck="false"
        aria-label="Buscar un lugar"
        aria-controls="search-results"
      />
      <kbd class="search__hint">/</kbd>
      <ul id="search-results" class="search__results" role="listbox" hidden></ul>
    </div>

    <div id="coords" class="coords" aria-live="off"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
